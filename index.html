<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#166c70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FACEN App">
  <link rel="manifest" href="manifest.webmanifest">
  <title>FACEN App</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f2f3a;
      color: #fff;
      overflow: hidden;
    }
    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .bar {
      min-height: 52px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #123646;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #d69f30;
      color: #13222c;
      font-weight: 900;
    }
    .brand strong { display: block; line-height: 1.1; }
    .brand span { display: block; color: rgba(255,255,255,.72); font-size: 12px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button, a.btn {
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.1);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary { background: #166c70; border-color: #166c70; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f7fb;
    }
    @media (max-width: 640px) {
      .bar { min-height: 48px; }
      .mark { width: 30px; height: 30px; }
      .brand { gap: 8px; flex: 1 1 auto; }
      .brand strong { font-size: 14px; }
      #shell-version {
        display: block;
        max-width: 78px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
      }
      .actions { gap: 6px; }
      button, a.btn { padding: 6px 7px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="brand">
        <div class="mark">F</div>
        <div><strong>FACEN App</strong><span id="shell-version">Actualizada</span></div>
      </div>
      <div class="actions">
        <button id="refresh" title="Actualizar a la version mas reciente">Actualizar</button>
        <button id="install" class="primary" hidden>Instalar</button>
        <a class="btn" id="open-direct" target="_blank" rel="noopener">Abrir</a>
      </div>
    </header>
    <iframe id="app" title="FACEN App"></iframe>
  </main>
  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzM0NMEZ57YImDz3puF5Ma4YT-tvwcZtjugGNuVWPsphnLWcddw6L_Snv_Vr6eSba7HyQ/exec';
    var APP_BUILD = '2026.06.29.3';
    var deferredPrompt = null;
    function versionedAppUrl() {
      var params = new URLSearchParams(window.location.search);
      var v = params.get('v') || APP_BUILD;
      return APP_URL + (v ? '?v=' + encodeURIComponent(v) : '');
    }

    document.getElementById('shell-version').textContent = 'v' + APP_BUILD;
    document.getElementById('app').src = versionedAppUrl();
    document.getElementById('open-direct').href = APP_URL;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(function(registration) {
        registration.update().catch(function() {});
      }).catch(function() {});
    }

    document.getElementById('refresh').addEventListener('click', function() {
      var stamp = Date.now();
      var clearCaches = 'caches' in window ? caches.keys().then(function(keys) {
        return Promise.all(keys.map(function(key) { return caches.delete(key); }));
      }) : Promise.resolve();
      var clearWorkers = 'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations().then(function(regs) {
        return Promise.all(regs.map(function(reg) { return reg.update().then(function() { return reg.unregister(); }).catch(function() { return reg.unregister(); }); }));
      }) : Promise.resolve();
      Promise.all([clearCaches, clearWorkers]).finally(function() {
        window.location.replace('./?v=' + APP_BUILD + '-' + stamp);
      });
    });

    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      deferredPrompt = event;
      document.getElementById('install').hidden = false;
    });

    document.getElementById('install').addEventListener('click', function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function() {
        deferredPrompt = null;
        document.getElementById('install').hidden = true;
      });
    });
  </script>
</body>
</html>
