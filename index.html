<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#166c70">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FACEN App">
  <link rel="manifest" href="manifest.webmanifest">
  <title>FACEN App</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f2f3a;
      color: #fff;
      overflow: hidden;
    }
    .shell {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .bar {
      min-height: 52px;
      padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #123646;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #d69f30;
      color: #13222c;
      font-weight: 900;
    }
    .brand strong { display: block; line-height: 1.1; }
    .brand span { display: block; color: rgba(255,255,255,.72); font-size: 12px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    button, a.btn {
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.1);
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    button.primary { background: #166c70; border-color: #166c70; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f7fb;
    }
    @media (max-width: 640px) {
      .bar { min-height: 48px; }
      .brand span { display: none; }
      button, a.btn { padding: 7px 9px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div class="brand">
        <div class="mark">F</div>
        <div><strong>FACEN App</strong><span>Instalable para estudiantes</span></div>
      </div>
      <div class="actions">
        <button id="install" class="primary" hidden>Instalar</button>
        <a class="btn" id="open-direct" target="_blank" rel="noopener">Abrir</a>
      </div>
    </header>
    <iframe id="app" title="FACEN App"></iframe>
  </main>
  <script>
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxPW313JYFjjRodLkOEPl6xswoDCM1ZkbeUtAALdrhIGBg2rY85YiBnJyzwmZz8F-on9Q/exec';
    var deferredPrompt = null;
    document.getElementById('app').src = APP_URL;
    document.getElementById('open-direct').href = APP_URL;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    }

    window.addEventListener('beforeinstallprompt', function(event) {
      event.preventDefault();
      deferredPrompt = event;
      document.getElementById('install').hidden = false;
    });

    document.getElementById('install').addEventListener('click', function() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.finally(function() {
        deferredPrompt = null;
        document.getElementById('install').hidden = true;
      });
    });
  </script>
</body>
</html>
