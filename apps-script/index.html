<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FACEN App</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #eef4f8;
      --ink: #14212e;
      --muted: #647586;
      --line: #d9e3eb;
      --primary: #166c70;
      --primary-2: #0f4e52;
      --accent: #d69f30;
      --danger: #b23b3b;
      --ok: #2f7d55;
      --shadow: 0 18px 50px rgba(25, 46, 70, .11);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 430px) 1fr;
      background: linear-gradient(120deg, #f7fbfc 0%, #eef5f1 100%);
    }
    .auth-panel {
      background: var(--surface);
      padding: 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: var(--shadow);
      z-index: 1;
    }
    .auth-art {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(rgba(15, 78, 82, .72), rgba(20, 33, 46, .54)),
        url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=1800&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: end;
      padding: 56px;
      color: #fff;
    }
    .auth-art h1 { font-size: clamp(38px, 6vw, 74px); line-height: .95; margin: 0 0 14px; letter-spacing: 0; }
    .auth-art p { max-width: 620px; font-size: 19px; line-height: 1.55; margin: 0; color: rgba(255,255,255,.88); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 8px;
      display: grid; place-items: center; background: var(--primary); color: #fff; font-weight: 900;
    }
    .brand strong { display: block; font-size: 18px; }
    .brand span { color: var(--muted); font-size: 13px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); padding: 4px; border-radius: 8px; margin-bottom: 20px; }
    .tab { border: 0; background: transparent; border-radius: 6px; padding: 10px; color: var(--muted); }
    .tab.active { background: #fff; color: var(--ink); box-shadow: 0 4px 14px rgba(31,50,68,.08); }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      outline: 0;
    }
    .textarea { min-height: 96px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,108,112,.12); }
    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 11px 14px;
      font-weight: 800;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-outline { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn-danger { background: #fff; color: var(--danger); border-color: rgba(178,59,59,.35); }
    .btn-small { min-height: 34px; padding: 7px 10px; font-size: 13px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    .sidebar {
      background: #112d3d;
      color: #e9f2f5;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .sidebar .brand span { color: #aebfc8; }
    .nav { display: grid; gap: 6px; }
    .nav button {
      border: 0;
      background: transparent;
      color: #cfe0e6;
      text-align: left;
      border-radius: 8px;
      padding: 11px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .nav button.active, .nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
    .main { min-width: 0; }
    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      background: rgba(244,247,251,.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 4;
    }
    .menu-btn { display: none; }
    .user-pill { color: var(--muted); font-weight: 700; }
    .content { padding: 26px; max-width: 1240px; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 18px; }
    .page-head h2 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .page-head p { margin: 6px 0 0; color: var(--muted); }
    .grid { display: grid; gap: 14px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(25,46,70,.05);
    }
    .card-pad { padding: 18px; }
    .metric span { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 8px; font-size: 30px; }
    .list { display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }
    .item-main { min-width: 0; }
    .title { font-weight: 900; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.45; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
      background: #eef4f8;
      color: #315264;
      white-space: nowrap;
    }
    .badge-ok { background: #e7f4ee; color: var(--ok); }
    .badge-warn { background: #fff4db; color: #8b6414; }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar .input, .toolbar .select { max-width: 280px; }
    .schedule { overflow-x: auto; }
    .schedule table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .schedule th, .schedule td { border-bottom: 1px solid var(--line); padding: 12px; text-align: left; vertical-align: top; }
    .schedule th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .note-row { grid-template-columns: 1.4fr repeat(5, .55fr) .8fr auto; display: grid; gap: 10px; align-items: center; }
    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #c9d6df;
      border-radius: 8px;
      background: rgba(255,255,255,.65);
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(11,22,31,.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .modal.show { display: flex; }
    .dialog { width: min(680px, 100%); max-height: 90vh; overflow: auto; background: #fff; border-radius: 8px; box-shadow: var(--shadow); }
    .dialog-head, .dialog-foot { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .dialog-foot { border-bottom: 0; border-top: 1px solid var(--line); justify-content: end; }
    .dialog-body { padding: 18px; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #152533;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      transform: translateY(130%);
      transition: .2s ease;
      z-index: 20;
      max-width: 360px;
    }
    .toast.show { transform: translateY(0); }
    .toast.error { background: var(--danger); }
    .toast.ok { background: var(--ok); }
    .mobile-nav { display: none; }
    @media (max-width: 900px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-art { min-height: 32vh; padding: 28px; align-items: center; }
      .auth-panel { padding: 28px; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 280px;
        z-index: 8;
        transform: translateX(-105%);
        transition: .2s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-flex; }
      .content { padding: 18px 14px 86px; }
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .page-head { align-items: start; flex-direction: column; }
      .item { align-items: stretch; flex-direction: column; }
      .note-row { grid-template-columns: 1fr 1fr; }
      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: #fff;
        border-top: 1px solid var(--line);
        z-index: 6;
      }
      .mobile-nav button { border: 0; background: #fff; padding: 9px 4px; font-size: 12px; color: var(--muted); }
      .mobile-nav button.active { color: var(--primary); font-weight: 900; }
    }
  </style>
</head>
<body>
  <section id="auth" class="auth-page">
    <div class="auth-panel">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>FACEN App</strong><span>Agenda academica</span></div>
      </div>
      <div class="tabs">
        <button id="login-tab" class="tab active" onclick="setAuthMode('login')">Ingresar</button>
        <button id="register-tab" class="tab" onclick="setAuthMode('register')">Crear cuenta</button>
      </div>
      <form id="login-form" class="form" onsubmit="login(event)">
        <div class="field"><label>Usuario</label><input class="input" name="username" autocomplete="username" required></div>
        <div class="field"><label>Contrasena</label><input class="input" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <form id="register-form" class="form hidden" onsubmit="register(event)">
        <div class="grid grid-2">
          <div class="field"><label>Nombres</label><input class="input" name="nombres" required></div>
          <div class="field"><label>Apellidos</label><input class="input" name="apellidos" required></div>
        </div>
        <div class="field"><label>Usuario</label><input class="input" name="username" autocomplete="username" required></div>
        <div class="field"><label>Contrasena</label><input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label>Email</label><input class="input" name="email" type="email"></div>
        <div class="grid grid-2">
          <div class="field"><label>Carrera</label><input class="input" name="carrera"></div>
          <div class="field"><label>Semestre</label><input class="input" name="semestre"></div>
        </div>
        <button class="btn btn-primary" type="submit">Crear y entrar</button>
      </form>
    </div>
    <div class="auth-art">
      <div>
        <h1>FACEN App</h1>
        <p>Materias, horarios, aulas, notas y apuntes en un solo lugar para que cada estudiante ordene su semestre sin pelearse con planillas.</p>
      </div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>FACEN App</strong><span id="user-name">Estudiante</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <button class="btn btn-outline" onclick="logout()">Cerrar sesion</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn btn-outline btn-small menu-btn" onclick="toggleMenu()">Menu</button>
        <strong id="view-title">Inicio</strong>
        <span class="user-pill" id="top-user"></span>
      </header>
      <div id="content" class="content"></div>
    </main>
    <nav id="mobile-nav" class="mobile-nav"></nav>
  </section>

  <div id="modal" class="modal" onclick="closeModalOnBackdrop(event)">
    <div class="dialog">
      <div class="dialog-head">
        <strong id="modal-title"></strong>
        <button class="btn btn-outline btn-small" onclick="closeModal()">Cerrar</button>
      </div>
      <div class="dialog-body" id="modal-body"></div>
      <div class="dialog-foot" id="modal-foot"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    var State = {
      token: localStorage.getItem('facen_token') || '',
      user: null,
      data: null,
      view: 'dashboard',
      nav: [
        ['dashboard', 'Inicio'],
        ['materias', 'Materias'],
        ['horario', 'Horario'],
        ['notas', 'Notas'],
        ['apuntes', 'Apuntes'],
        ['recordatorios', 'Recordatorios'],
        ['perfil', 'Perfil']
      ]
    };

    document.addEventListener('DOMContentLoaded', function() {
      buildNav();
      if (!State.token) return showAuth();
      server('verificarSesion', [State.token], function(res) {
        if (res && res.valid) {
          State.user = res.user;
          loadApp();
        } else {
          localStorage.removeItem('facen_token');
          showAuth();
        }
      }, showAuth);
    });

    function server(fn, args, ok, fail) {
      var runner = google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success === false) {
            toast(res.message || 'No se pudo completar', 'error');
            if (fail) fail(res);
            return;
          }
          if (ok) ok(res);
        })
        .withFailureHandler(function(err) {
          toast((err && err.message) || 'Error de conexion', 'error');
          if (fail) fail(err);
        });
      runner[fn].apply(runner, args || []);
    }

    function setAuthMode(mode) {
      document.getElementById('login-tab').classList.toggle('active', mode === 'login');
      document.getElementById('register-tab').classList.toggle('active', mode === 'register');
      document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
    }

    function login(e) {
      e.preventDefault();
      var data = formData(e.target);
      server('iniciarSesion', [data.username, data.password], afterLogin);
    }

    function register(e) {
      e.preventDefault();
      server('registrarEstudiante', [formData(e.target)], afterLogin);
    }

    function afterLogin(res) {
      State.token = res.token;
      State.user = res.user;
      localStorage.setItem('facen_token', State.token);
      loadApp();
    }

    function loadApp() {
      showAppShell();
      document.getElementById('content').innerHTML = '<div class="empty">Cargando tus datos...</div>';
      server('obtenerBootstrap', [State.token], function(res) {
        State.data = res;
        State.user = res.user;
        document.getElementById('user-name').textContent = res.user.nombre || res.user.username;
        document.getElementById('top-user').textContent = res.user.nombre || res.user.username;
        render();
      });
    }

    function showAuth() {
      document.getElementById('auth').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    }

    function showAppShell() {
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    function buildNav() {
      var html = State.nav.map(function(n) {
        return '<button data-view="' + n[0] + '" onclick="go(\'' + n[0] + '\')">' + n[1] + '</button>';
      }).join('');
      document.getElementById('nav').innerHTML = html;
      document.getElementById('mobile-nav').innerHTML = html;
    }

    function go(view) {
      State.view = view;
      document.getElementById('sidebar').classList.remove('open');
      render();
    }

    function render() {
      if (!State.data) return;
      document.querySelectorAll('[data-view]').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-view') === State.view);
      });
      var titles = { dashboard: 'Inicio', materias: 'Materias', horario: 'Horario', notas: 'Notas', apuntes: 'Apuntes', recordatorios: 'Recordatorios', perfil: 'Perfil' };
      document.getElementById('view-title').textContent = titles[State.view] || 'FACEN App';
      var views = {
        dashboard: renderDashboard,
        materias: renderMaterias,
        horario: renderHorario,
        notas: renderNotas,
        apuntes: renderApuntes,
        recordatorios: renderRecordatorios,
        perfil: renderPerfil
      };
      document.getElementById('content').innerHTML = views[State.view]();
    }

    function renderDashboard() {
      var r = State.data.resumen || {};
      var clases = (r.clasesHoy || []).map(function(c) {
        return item(c.asignatura + ' - Seccion ' + c.seccion, c.horario.hora_ini + ' a ' + c.horario.hora_fin + ' - ' + c.horario.aula, '');
      }).join('') || '<div class="empty">No tenes clases cargadas para hoy.</div>';
      var eventos = upcomingEvents().slice(0, 4).map(function(e) {
        return item(e.titulo, [e.fecha_iso, e.hora, e.nombre_asignatura].filter(Boolean).join(' - '), badge(e.tipo || 'recordatorio'));
      }).join('') || '<div class="empty">Sin recordatorios proximos.</div>';
      return head('Inicio', 'Resumen rapido de tu semestre.') +
        '<div class="grid grid-4">' +
          metric('Asignaturas', r.totalAsignaturas || 0) +
          metric('Promedio', fmt(r.promedio || 0)) +
          metric('Aprobadas', r.aprobadas || 0) +
          metric('Apuntes', (State.data.apuntes || []).length) +
        '</div>' +
        '<div class="grid grid-2" style="margin-top:14px;">' +
          '<section class="card card-pad"><h3>Clases de hoy</h3><div class="list">' + clases + '</div></section>' +
          '<section class="card card-pad"><h3>Proximos recordatorios</h3><div class="list">' + eventos + '</div></section>' +
        '</div>';
    }

    function renderMaterias() {
      var q = '';
      var actuales = (State.data.inscripciones || []).map(function(i) {
        var horarios = i.horarios.map(function(h) { return h.dia + ' ' + h.hora_ini + '-' + h.hora_fin + ' - ' + h.aula; }).join('\n');
        return item(i.nombre_asignatura + ' - ' + i.codigo_seccion, horarios || 'Sin horario', '<button class="btn btn-danger btn-small" onclick="quitarMateria(' + i.id_inscripcion + ')">Quitar</button>');
      }).join('') || '<div class="empty">Todavia no seleccionaste asignaturas.</div>';
      var catalogo = State.data.catalogo.map(function(a) {
        var secs = (a.secciones || []).map(function(s) {
          var hs = s.horarios.map(function(h) { return h.dia + ' ' + h.hora_ini + '-' + h.hora_fin + ' - ' + h.aula; }).join(', ');
          return '<button class="btn btn-outline btn-small" onclick="inscribir(' + s.id_seccion + ')">Seccion ' + esc(s.codigo_seccion) + '</button><div class="sub">' + esc(hs || 'Sin horario') + '</div>';
        }).join('<div style="height:8px"></div>');
        return '<article class="card card-pad subject" data-search="' + esc((a.codigo + ' ' + a.nombre_asignatura + ' ' + a.carrera).toLowerCase()) + '">' +
          '<div class="title">' + esc(a.codigo) + ' - ' + esc(a.nombre_asignatura) + '</div>' +
          '<div class="sub">' + esc(a.carrera) + ' - Semestre ' + esc(a.semestre) + '</div>' +
          '<div style="margin-top:12px;">' + secs + '</div></article>';
      }).join('');
      return head('Materias', 'Selecciona las asignaturas y secciones que estas cursando.', '<button class="btn btn-outline" onclick="loadApp()">Actualizar</button>') +
        '<section class="card card-pad"><h3>Mis asignaturas</h3><div class="list">' + actuales + '</div></section>' +
        '<div class="toolbar" style="margin-top:18px;"><input class="input" placeholder="Buscar asignatura, codigo o carrera" oninput="filterSubjects(this.value)"></div>' +
        '<div class="grid grid-3" id="subject-grid">' + catalogo + '</div>';
    }

    function renderHorario() {
      var rows = [];
      State.data.inscripciones.forEach(function(i) {
        i.horarios.forEach(function(h) { rows.push({ materia: i.nombre_asignatura, seccion: i.codigo_seccion, h: h }); });
      });
      rows.sort(function(a, b) { return dayOrder(a.h.dia) - dayOrder(b.h.dia) || String(a.h.hora_ini).localeCompare(String(b.h.hora_ini)); });
      var body = rows.map(function(r) {
        return '<tr><td>' + esc(r.h.dia) + '</td><td>' + esc(r.h.hora_ini) + ' - ' + esc(r.h.hora_fin) + '</td><td><strong>' + esc(r.materia) + '</strong><div class="sub">Seccion ' + esc(r.seccion) + '</div></td><td>' + esc(r.h.aula) + '<div class="sub">' + esc(r.h.edificio || '') + '</div></td></tr>';
      }).join('');
      return head('Horario', 'Vista ordenada de clases y aulas asignadas.') +
        '<div class="card card-pad schedule">' + (body ? '<table><thead><tr><th>Dia</th><th>Hora</th><th>Asignatura</th><th>Aula</th></tr></thead><tbody>' + body + '</tbody></table>' : '<div class="empty">Agrega materias para ver tu horario.</div>') + '</div>';
    }

    function renderNotas() {
      var rows = State.data.notas.map(function(n) {
        return '<div class="item note-row">' +
          '<div><div class="title">' + esc(n.nombre_asignatura) + '</div><div class="sub">Seccion ' + esc(n.codigo_seccion) + '</div></div>' +
          '<div>' + fmt(n.parcial1) + '</div><div>' + fmt(n.parcial2) + '</div><div>' + fmt(n.trabajos) + '</div><div>' + fmt(n.final) + '</div>' +
          '<div><strong>' + fmt(n.promedio) + '</strong><div class="sub">' + esc(n.estado || 'En curso') + '</div></div>' +
          '<button class="btn btn-outline btn-small" onclick="openNota(' + n.id_inscripcion + ')">Editar</button></div>';
      }).join('') || '<div class="empty">Agrega materias para registrar notas.</div>';
      return head('Notas', 'Registra tus parciales, trabajos, finales y observaciones.') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function renderApuntes() {
      var rows = State.data.apuntes.map(function(a) {
        return item(a.titulo, [a.tipo, a.nombre_asignatura, a.fecha_modificacion].filter(Boolean).join(' - '), '<button class="btn btn-outline btn-small" onclick="openApunte(' + a.id_apunte + ')">Editar</button><button class="btn btn-danger btn-small" onclick="deleteApunte(' + a.id_apunte + ')">Eliminar</button>');
      }).join('') || '<div class="empty">Crea tu primer apunte.</div>';
      return head('Apuntes', 'Guarda informacion util, enlaces, tareas y recordatorios de estudio.', '<button class="btn btn-primary" onclick="openApunte()">Nuevo apunte</button>') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function renderRecordatorios() {
      var rows = State.data.eventos.map(function(e) {
        return item(e.titulo, [e.fecha_iso, e.hora, e.nombre_asignatura, e.descripcion].filter(Boolean).join(' - '), '<button class="btn btn-outline btn-small" onclick="openEvento(' + e.id_evento + ')">Editar</button><button class="btn btn-danger btn-small" onclick="deleteEvento(' + e.id_evento + ')">Eliminar</button>');
      }).join('') || '<div class="empty">Sin recordatorios guardados.</div>';
      return head('Recordatorios', 'Fechas importantes, entregas, examenes y eventos propios.', '<button class="btn btn-primary" onclick="openEvento()">Nuevo</button>') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function renderPerfil() {
      var p = State.data.perfil || {};
      return head('Perfil', 'Datos academicos y personales.') +
        '<form class="card card-pad form" onsubmit="savePerfil(event)">' +
        '<div class="grid grid-2"><div class="field"><label>Nombres</label><input class="input" name="nombres" value="' + escAttr(p.nombres) + '"></div><div class="field"><label>Apellidos</label><input class="input" name="apellidos" value="' + escAttr(p.apellidos) + '"></div></div>' +
        '<div class="grid grid-3"><div class="field"><label>Cedula</label><input class="input" name="cedula" value="' + escAttr(p.cedula) + '"></div><div class="field"><label>Email</label><input class="input" name="email" value="' + escAttr(p.email) + '"></div><div class="field"><label>Telefono</label><input class="input" name="telefono" value="' + escAttr(p.telefono) + '"></div></div>' +
        '<div class="grid grid-3"><div class="field"><label>Carrera</label><input class="input" name="carrera" value="' + escAttr(p.carrera) + '"></div><div class="field"><label>Semestre</label><input class="input" name="semestre" value="' + escAttr(p.semestre) + '"></div><div class="field"><label>Turno</label><input class="input" name="turno" value="' + escAttr(p.turno) + '"></div></div>' +
        '<div class="field"><label>Observaciones</label><textarea class="textarea" name="observaciones">' + esc(p.observaciones) + '</textarea></div>' +
        '<button class="btn btn-primary">Guardar perfil</button></form>';
    }

    function head(title, desc, action) {
      return '<div class="page-head"><div><h2>' + title + '</h2><p>' + desc + '</p></div><div>' + (action || '') + '</div></div>';
    }
    function metric(label, value) { return '<div class="card card-pad metric"><span>' + label + '</span><strong>' + value + '</strong></div>'; }
    function item(title, sub, action) { return '<div class="item"><div class="item-main"><div class="title">' + esc(title) + '</div><div class="sub">' + esc(sub).replace(/\n/g, '<br>') + '</div></div><div style="display:flex;gap:8px;flex-wrap:wrap;">' + (action || '') + '</div></div>'; }
    function badge(text) { return '<span class="badge">' + esc(text) + '</span>'; }

    function inscribir(id) { server('inscribirSeccion', [State.token, id], function() { toast('Materia agregada', 'ok'); loadApp(); }); }
    function quitarMateria(id) { if (confirm('Quitar esta asignatura?')) server('quitarInscripcion', [State.token, id], function() { loadApp(); }); }

    function openNota(idInscripcion) {
      var n = State.data.notas.find(function(x) { return x.id_inscripcion == idInscripcion; }) || {};
      openModal('Editar nota', '<form id="nota-form" class="form">' +
        inputsScores(n) +
        '<div class="field"><label>Observaciones</label><textarea class="textarea" name="observaciones">' + esc(n.observaciones) + '</textarea></div></form>',
        '<button class="btn btn-primary" onclick="saveNota(' + idInscripcion + ')">Guardar</button>');
    }
    function inputsScores(n) {
      return '<div class="grid grid-2"><div class="field"><label>Parcial 1</label><input class="input" name="parcial1" type="number" min="0" max="5" step=".01" value="' + escAttr(n.parcial1) + '"></div><div class="field"><label>Parcial 2</label><input class="input" name="parcial2" type="number" min="0" max="5" step=".01" value="' + escAttr(n.parcial2) + '"></div></div>' +
        '<div class="grid grid-2"><div class="field"><label>Trabajos</label><input class="input" name="trabajos" type="number" min="0" max="5" step=".01" value="' + escAttr(n.trabajos) + '"></div><div class="field"><label>Final</label><input class="input" name="final" type="number" min="0" max="5" step=".01" value="' + escAttr(n.final) + '"></div></div>';
    }
    function saveNota(id) { server('guardarNota', [State.token, id, formData(document.getElementById('nota-form'))], function() { closeModal(); loadApp(); }); }

    function openApunte(id) {
      var a = id ? State.data.apuntes.find(function(x) { return x.id_apunte == id; }) : {};
      a = a || {};
      openModal(id ? 'Editar apunte' : 'Nuevo apunte', '<form id="apunte-form" class="form">' +
        '<input type="hidden" name="id_apunte" value="' + escAttr(a.id_apunte) + '">' +
        '<div class="field"><label>Titulo</label><input class="input" name="titulo" value="' + escAttr(a.titulo) + '" required></div>' +
        '<div class="grid grid-2"><div class="field"><label>Tipo</label><select class="select" name="tipo">' + options(['apunte','tarea','link','recordatorio'], a.tipo) + '</select></div><div class="field"><label>Asignatura</label><select class="select" name="id_asignatura">' + subjectOptions(a.id_asignatura) + '</select></div></div>' +
        '<div class="field"><label>Contenido</label><textarea class="textarea" name="contenido">' + esc(a.contenido) + '</textarea></div></form>',
        '<button class="btn btn-primary" onclick="saveApunte()">Guardar</button>');
    }
    function saveApunte() { server('guardarApunte', [State.token, formData(document.getElementById('apunte-form'))], function() { closeModal(); loadApp(); }); }
    function deleteApunte(id) { if (confirm('Eliminar apunte?')) server('eliminarApunte', [State.token, id], function() { loadApp(); }); }

    function openEvento(id) {
      var e = id ? State.data.eventos.find(function(x) { return x.id_evento == id; }) : {};
      e = e || {};
      openModal(id ? 'Editar recordatorio' : 'Nuevo recordatorio', '<form id="evento-form" class="form">' +
        '<input type="hidden" name="id_evento" value="' + escAttr(e.id_evento) + '">' +
        '<div class="field"><label>Titulo</label><input class="input" name="titulo" value="' + escAttr(e.titulo) + '" required></div>' +
        '<div class="grid grid-3"><div class="field"><label>Fecha</label><input class="input" name="fecha" type="date" value="' + escAttr(e.fecha_iso) + '" required></div><div class="field"><label>Hora</label><input class="input" name="hora" type="time" value="' + escAttr(e.hora) + '"></div><div class="field"><label>Tipo</label><select class="select" name="tipo">' + options(['examen','entrega','estudio','recordatorio'], e.tipo) + '</select></div></div>' +
        '<div class="field"><label>Asignatura</label><select class="select" name="id_asignatura">' + subjectOptions(e.id_asignatura) + '</select></div>' +
        '<div class="field"><label>Descripcion</label><textarea class="textarea" name="descripcion">' + esc(e.descripcion) + '</textarea></div></form>',
        '<button class="btn btn-primary" onclick="saveEvento()">Guardar</button>');
    }
    function saveEvento() { server('guardarEvento', [State.token, formData(document.getElementById('evento-form'))], function() { closeModal(); loadApp(); }); }
    function deleteEvento(id) { if (confirm('Eliminar recordatorio?')) server('eliminarEvento', [State.token, id], function() { loadApp(); }); }

    function savePerfil(e) {
      e.preventDefault();
      server('guardarPerfil', [State.token, formData(e.target)], function() { toast('Perfil guardado', 'ok'); loadApp(); });
    }

    function subjectOptions(selected) {
      var opts = '<option value="">Sin asignatura</option>';
      State.data.inscripciones.forEach(function(i) {
        opts += '<option value="' + i.id_asignatura + '"' + (String(selected) === String(i.id_asignatura) ? ' selected' : '') + '>' + esc(i.nombre_asignatura) + '</option>';
      });
      return opts;
    }
    function options(list, selected) {
      return list.map(function(v) { return '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>'; }).join('');
    }
    function filterSubjects(q) {
      q = String(q || '').toLowerCase();
      document.querySelectorAll('.subject').forEach(function(el) {
        el.style.display = el.getAttribute('data-search').indexOf(q) >= 0 ? '' : 'none';
      });
    }
    function upcomingEvents() {
      var today = new Date(); today.setHours(0,0,0,0);
      return State.data.eventos.filter(function(e) { return new Date(e.fecha_iso || e.fecha) >= today; });
    }
    function dayOrder(day) {
      return ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'].indexOf(norm(day));
    }
    function logout() {
      server('cerrarSesion', [State.token], function() {});
      localStorage.removeItem('facen_token');
      State.token = '';
      State.data = null;
      showAuth();
    }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    function openModal(title, body, foot) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-foot').innerHTML = foot || '';
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
    function closeModalOnBackdrop(e) { if (e.target.id === 'modal') closeModal(); }
    function toast(msg, type) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(function() { t.className = 'toast'; }, 2800);
    }
    function formData(form) {
      var obj = {};
      Array.prototype.forEach.call(new FormData(form).entries(), function(pair) { obj[pair[0]] = pair[1]; });
      return obj;
    }
    function fmt(v) { return v === '' || v === null || v === undefined || isNaN(v) ? '-' : Number(v).toFixed(2); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function escAttr(s) { return esc(s); }
    function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  </script>
</body>
</html>
