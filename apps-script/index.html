<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FACEN App</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #eef4f8;
      --ink: #14212e;
      --muted: #647586;
      --line: #d9e3eb;
      --primary: #166c70;
      --primary-2: #0f4e52;
      --accent: #d69f30;
      --danger: #b23b3b;
      --ok: #2f7d55;
      --shadow: 0 18px 50px rgba(25, 46, 70, .11);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .62; }
    .hidden { display: none !important; }
    .auth-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 430px) 1fr;
      background: linear-gradient(120deg, #f7fbfc 0%, #eef5f1 100%);
    }
    .auth-panel {
      background: var(--surface);
      padding: 42px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: var(--shadow);
      z-index: 1;
    }
    .auth-art {
      position: relative;
      overflow: hidden;
      background: #123646;
      display: flex;
      align-items: end;
      padding: 56px;
      color: #fff;
    }
    .auth-art:before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(22,108,112,.94), rgba(17,45,61,.78)),
        repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 1px, transparent 1px 18px);
    }
    .auth-art > div { position: relative; }
    .auth-art h1 { font-size: clamp(38px, 6vw, 74px); line-height: .95; margin: 0 0 14px; letter-spacing: 0; }
    .auth-art p { max-width: 620px; font-size: 19px; line-height: 1.55; margin: 0; color: rgba(255,255,255,.88); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 8px;
      display: grid; place-items: center; background: var(--primary); color: #fff; font-weight: 900;
    }
    .brand strong { display: block; font-size: 18px; }
    .brand span { color: var(--muted); font-size: 13px; }
    .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface-2); padding: 4px; border-radius: 8px; margin-bottom: 20px; }
    .tab { border: 0; background: transparent; border-radius: 6px; padding: 10px; color: var(--muted); }
    .tab.active { background: #fff; color: var(--ink); box-shadow: 0 4px 14px rgba(31,50,68,.08); }
    .form { display: grid; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      outline: 0;
    }
    .textarea { min-height: 96px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(22,108,112,.12); }
    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 11px 14px;
      font-weight: 800;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 42px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-2); }
    .btn-outline { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn-danger { background: #fff; color: var(--danger); border-color: rgba(178,59,59,.35); }
    .btn-small { min-height: 34px; padding: 7px 10px; font-size: 13px; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 260px 1fr; }
    .sidebar {
      background: #112d3d;
      color: #e9f2f5;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .sidebar .brand span { color: #aebfc8; }
    .nav { display: grid; gap: 6px; }
    .nav button {
      border: 0;
      background: transparent;
      color: #cfe0e6;
      text-align: left;
      border-radius: 8px;
      padding: 11px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .nav button.active, .nav button:hover { background: rgba(255,255,255,.1); color: #fff; }
    .main { min-width: 0; }
    .topbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 26px;
      background: rgba(244,247,251,.86);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 4;
    }
    .menu-btn { display: none; }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .user-pill { color: var(--muted); font-weight: 700; }
    .content { padding: 26px; max-width: 1240px; margin: 0 auto; }
    .page-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin-bottom: 18px; }
    .page-head h2 { margin: 0; font-size: 28px; letter-spacing: 0; }
    .page-head p { margin: 6px 0 0; color: var(--muted); }
    .grid { display: grid; gap: 14px; }
    .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 8px 20px rgba(25,46,70,.05);
    }
    .card-pad { padding: 18px; }
    .metric span { color: var(--muted); font-size: 13px; font-weight: 800; text-transform: uppercase; }
    .metric strong { display: block; margin-top: 8px; font-size: 30px; }
    .list { display: grid; gap: 10px; }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
    }
    .item-main { min-width: 0; }
    .title { font-weight: 900; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.45; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
      background: #eef4f8;
      color: #315264;
      white-space: nowrap;
    }
    .badge-ok { background: #e7f4ee; color: var(--ok); }
    .badge-warn { background: #fff4db; color: #8b6414; }
    .badge-danger { background: #fdeaea; color: var(--danger); }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .toolbar .input, .toolbar .select { max-width: 280px; }
    .schedule { overflow-x: auto; }
    .schedule table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .schedule th, .schedule td { border-bottom: 1px solid var(--line); padding: 12px; text-align: left; vertical-align: top; }
    .schedule th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .note-row { grid-template-columns: 1.4fr repeat(5, .55fr) .8fr auto; display: grid; gap: 10px; align-items: center; }
    .planner {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 14px;
    }
    .compact-list { display: grid; gap: 8px; }
    .compact {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .compact:last-child { border-bottom: 0; }
    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed #c9d6df;
      border-radius: 8px;
      background: rgba(255,255,255,.65);
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(11,22,31,.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }
    .modal.show { display: flex; }
    .dialog { width: min(680px, 100%); max-height: 90vh; overflow: auto; background: #fff; border-radius: 8px; box-shadow: var(--shadow); }
    .dialog-head, .dialog-foot { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .dialog-foot { border-bottom: 0; border-top: 1px solid var(--line); justify-content: end; }
    .dialog-body { padding: 18px; }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #152533;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      transform: translateY(130%);
      transition: .2s ease;
      z-index: 20;
      max-width: 360px;
    }
    .toast.show { transform: translateY(0); }
    .toast.error { background: var(--danger); }
    .toast.ok { background: var(--ok); }
    .mobile-nav { display: none; }
    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #eef4f8;
      flex-wrap: wrap;
    }
    .segmented button {
      border: 0;
      background: transparent;
      border-radius: 6px;
      padding: 8px 11px;
      color: var(--muted);
      font-weight: 900;
    }
    .segmented button.active { background: #fff; color: var(--ink); box-shadow: 0 4px 12px rgba(31,50,68,.08); }
    .calendar-card { overflow: hidden; }
    .calendar-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 16px;
    }
    .calendar-title { display: grid; gap: 4px; }
    .calendar-title strong { font-size: 22px; }
    .calendar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .calendar-weekdays, .month-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }
    .calendar-weekdays {
      gap: 6px;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .calendar-weekdays div { padding: 0 4px; }
    .month-grid { gap: 6px; }
    .calendar-day {
      min-height: 124px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }
    .calendar-day:hover { border-color: rgba(22,108,112,.45); box-shadow: 0 8px 18px rgba(25,46,70,.07); }
    .calendar-day.outside { background: #f7fafc; color: #9aacb9; }
    .calendar-day.today { outline: 2px solid rgba(214,159,48,.7); outline-offset: -2px; }
    .day-number { display: flex; align-items: center; justify-content: space-between; font-weight: 900; }
    .event-dot { font-size: 11px; color: var(--muted); font-weight: 800; }
    .calendar-event {
      width: 100%;
      border: 0;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      background: #eef8f7;
      color: var(--ink);
      padding: 6px 7px;
      text-align: left;
      display: grid;
      gap: 2px;
      min-height: 32px;
    }
    .calendar-event strong { font-size: 12px; line-height: 1.2; }
    .calendar-event span { font-size: 11px; color: var(--muted); line-height: 1.2; }
    .calendar-event.examen { border-left-color: var(--danger); background: #fff0ef; }
    .calendar-event.entrega { border-left-color: #8b6414; background: #fff7e6; }
    .calendar-event.reunion { border-left-color: #356c9d; background: #edf5ff; }
    .calendar-event.automatic { border-style: solid; border-width: 1px 1px 1px 4px; border-color: rgba(22,108,112,.2) rgba(22,108,112,.2) rgba(22,108,112,.2) var(--primary); }
    .calendar-event.examen.automatic { border-left-color: var(--danger); }
    .calendar-event.entrega.automatic { border-left-color: #8b6414; }
    .calendar-event.reunion.automatic { border-left-color: #356c9d; }
    .week-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .week-col { min-height: 360px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 10px; display: grid; align-content: start; gap: 8px; }
    .day-view { display: grid; gap: 8px; }
    .day-slot { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: start; border-bottom: 1px solid var(--line); padding: 9px 0; }
    .day-slot:last-child { border-bottom: 0; }
    .day-time { color: var(--muted); font-weight: 900; font-size: 12px; }
    .year-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .year-month { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 12px; display: grid; gap: 8px; min-height: 118px; }
    .year-month strong { display: flex; justify-content: space-between; gap: 8px; }
    .agenda-list-row { display: grid; grid-template-columns: 116px 1fr auto; gap: 12px; align-items: center; }
    .notify-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fbfc;
      margin-bottom: 14px;
    }
    .progress-shell { display: grid; gap: 16px; }
    .progress-band {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items: stretch;
    }
    .progress-bar {
      height: 16px;
      border-radius: 999px;
      background: #e3ebf0;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .progress-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--ok), var(--primary)); }
    .malla-layout { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; }
    .malla-timeline { display: grid; gap: 16px; }
    .malla-level { display: grid; gap: 8px; }
    .malla-level h3 { margin: 0; font-size: 16px; }
    .malla-subject {
      border: 1px solid var(--line);
      border-left: 5px solid #9aacb9;
      border-radius: 8px;
      padding: 12px;
      background: #fff;
      display: grid;
      gap: 8px;
    }
    .malla-subject.aprobada { border-left-color: var(--ok); background: #f4fbf7; }
    .malla-subject.cursando { border-left-color: var(--primary); background: #f1faf9; }
    .malla-subject.pendiente { border-left-color: var(--accent); background: #fffaf0; }
    .malla-subject.bloqueada { border-left-color: #9aacb9; background: #f7fafc; }
    .status-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .req-list { color: var(--muted); font-size: 12px; line-height: 1.45; }
    @media (max-width: 900px) {
      .auth-page { grid-template-columns: 1fr; }
      .auth-art { min-height: 32vh; padding: 28px; align-items: center; }
      .auth-panel { padding: 28px; }
      .app { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 280px;
        z-index: 8;
        transform: translateX(-105%);
        transition: .2s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .menu-btn { display: inline-flex; }
      .top-actions { margin-left: auto; }
      .top-actions .user-pill { display: none; }
      .content { padding: 18px 14px 86px; }
      .grid-5, .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
      .page-head { align-items: start; flex-direction: column; }
      .item { align-items: stretch; flex-direction: column; }
      .note-row { grid-template-columns: 1fr 1fr; }
      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: #fff;
        border-top: 1px solid var(--line);
        z-index: 6;
      }
      .mobile-nav button { border: 0; background: #fff; padding: 9px 4px; font-size: 12px; color: var(--muted); }
      .mobile-nav button.active { color: var(--primary); font-weight: 900; }
      .planner { grid-template-columns: 1fr; }
      .calendar-top, .progress-band, .malla-layout { grid-template-columns: 1fr; }
      .calendar-actions { justify-content: flex-start; }
      .calendar-weekdays { display: none; }
      .month-grid, .week-grid, .year-grid { grid-template-columns: 1fr; }
      .calendar-day, .week-col { min-height: auto; }
      .agenda-list-row { grid-template-columns: 1fr; align-items: stretch; }
      .notify-strip { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <section id="auth" class="auth-page">
    <div class="auth-panel">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>FACEN App</strong><span>Agenda academica</span></div>
      </div>
      <div class="tabs">
        <button id="login-tab" class="tab active" onclick="setAuthMode('login')">Ingresar</button>
        <button id="register-tab" class="tab" onclick="setAuthMode('register')">Crear cuenta</button>
        <button id="recover-tab" class="tab" onclick="setAuthMode('recover')">Recuperar</button>
      </div>
      <form id="login-form" class="form" onsubmit="login(event)">
        <div class="field"><label>Usuario</label><input class="input" name="username" autocomplete="username" required></div>
        <div class="field"><label>Contrasena</label><input class="input" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <form id="recover-form" class="form hidden" onsubmit="recoverPassword(event)">
        <div class="field"><label>Usuario</label><input class="input" name="username" autocomplete="username" required></div>
        <div class="grid grid-2">
          <div class="field"><label>Email del perfil</label><input class="input" name="email" type="email"></div>
          <div class="field"><label>Cedula del perfil</label><input class="input" name="cedula"></div>
        </div>
        <button class="btn btn-primary" type="submit">Generar temporal</button>
        <div id="recover-result" class="empty hidden"></div>
      </form>
      <form id="register-form" class="form hidden" onsubmit="register(event)">
        <div class="grid grid-2">
          <div class="field"><label>Nombres</label><input class="input" name="nombres" required></div>
          <div class="field"><label>Apellidos</label><input class="input" name="apellidos" required></div>
        </div>
        <div class="field"><label>Usuario</label><input class="input" name="username" autocomplete="username" required></div>
        <div class="field"><label>Contrasena</label><input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="field"><label>Email</label><input class="input" name="email" type="email"></div>
        <div class="field"><label><input type="checkbox" name="comparte_contacto"> Compartir mi movil con companeros de mis asignaturas</label></div>
        <div class="grid grid-2">
          <div class="field"><label>Carrera</label><select class="select" name="carrera" id="register-carrera"><option value="">Seleccionar carrera</option></select></div>
          <div class="field"><label>Semestre</label><input class="input" name="semestre"></div>
        </div>
        <button class="btn btn-primary" type="submit">Crear y entrar</button>
      </form>
    </div>
    <div class="auth-art">
      <div>
        <h1>FACEN App</h1>
        <p>Materias, horarios, aulas, notas y apuntes en un solo lugar para que cada estudiante ordene su semestre sin pelearse con planillas.</p>
      </div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>FACEN App</strong><span id="user-name">Estudiante</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <button class="btn btn-outline" onclick="logout()">Cerrar sesion</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn btn-outline btn-small menu-btn" onclick="toggleMenu()">Menu</button>
        <strong id="view-title">Inicio</strong>
        <div class="top-actions">
          <button class="btn btn-outline btn-small" onclick="updateAppVersion()">Actualizar app</button>
          <span class="user-pill" id="top-user"></span>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>
    <nav id="mobile-nav" class="mobile-nav"></nav>
  </section>

  <div id="modal" class="modal" onclick="closeModalOnBackdrop(event)">
    <div class="dialog">
      <div class="dialog-head">
        <strong id="modal-title"></strong>
        <button class="btn btn-outline btn-small" onclick="closeModal()">Cerrar</button>
      </div>
      <div class="dialog-body" id="modal-body"></div>
      <div class="dialog-foot" id="modal-foot"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    var State = {
      token: localStorage.getItem('facen_token') || '',
      user: null,
      data: null,
      view: 'dashboard',
      calendarView: localStorage.getItem('facen_calendar_view') || 'month',
      calendarDate: localStorage.getItem('facen_calendar_date') || new Date().toISOString().slice(0, 10),
      alertTimers: [],
      authCarrerasLoaded: false,
      nav: [
        ['dashboard', 'Inicio'],
        ['materias', 'Materias'],
        ['avance', 'Avance'],
        ['horario', 'Horario'],
        ['agenda', 'Agenda'],
        ['notas', 'Notas'],
        ['apuntes', 'Apuntes'],
        ['lecturas', 'Lecturas'],
        ['companeros', 'Companeros'],
        ['grupos', 'Grupos'],
        ['recordatorios', 'Recordatorios'],
        ['perfil', 'Perfil']
      ]
    };
    var DEFAULT_CARRERAS = [
      'Licenciatura en Biotecnologia',
      'Licenciatura en Ciencias Mencion Biologia',
      'Licenciatura en Ciencias Mencion Fisica',
      'Licenciatura en Ciencias Mencion Geologia',
      'Licenciatura en Ciencias Mencion Matematica Estadistica',
      'Licenciatura en Ciencias Mencion Matematica Pura',
      'Licenciatura en Ciencias Mencion Quimica',
      'Licenciatura en Educacion Matematica',
      'Licenciatura en Fisica Medica',
      'Licenciatura en Logistica y Gestion del Transporte',
      'Licenciatura en Radiologia e Imagenologia',
      'Licenciatura en Tecnologia de Produccion'
    ];

    document.addEventListener('DOMContentLoaded', function() {
      window.onerror = function(message, source, lineno, colno, error) {
        showFatal('Error de pantalla: ' + (message || (error && error.message) || 'desconocido'));
        return false;
      };
      window.onunhandledrejection = function(event) {
        var reason = event && event.reason;
        showFatal('Error asincrono: ' + ((reason && reason.message) || reason || 'desconocido'));
      };
      buildNav();
      if (!State.token) return showAuth();
      server('verificarSesion', [State.token], function(res) {
        if (res && res.valid) {
          State.user = res.user;
          loadApp();
        } else {
          localStorage.removeItem('facen_token');
          showAuth();
        }
      }, showAuth);
    });

    function server(fn, args, ok, fail) {
      var runner = google.script.run
        .withSuccessHandler(function(res) {
          try {
            if (res && res.success === false) {
              toast(res.message || 'No se pudo completar', 'error');
              if (fail) fail(res);
              return;
            }
            if (ok) ok(res || {});
          } catch (e) {
            showFatal('Error procesando respuesta de ' + fn + ': ' + e.message);
          }
        })
        .withFailureHandler(function(err) {
          toast((err && err.message) || 'Error de conexion', 'error');
          if (fail) fail(err);
        });
      runner[fn].apply(runner, args || []);
    }

    function showFatal(message) {
      var el = document.getElementById('content');
      if (el) {
        el.innerHTML = '<div class="empty">' + esc(message) + '<br><br><button class="btn btn-outline btn-small" onclick="loadApp()">Reintentar</button> <button class="btn btn-danger btn-small" onclick="logout()">Cerrar sesion</button></div>';
      } else {
        toast(message, 'error');
      }
    }

    function setAuthMode(mode) {
      document.getElementById('login-tab').classList.toggle('active', mode === 'login');
      document.getElementById('register-tab').classList.toggle('active', mode === 'register');
      document.getElementById('recover-tab').classList.toggle('active', mode === 'recover');
      document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
      document.getElementById('recover-form').classList.toggle('hidden', mode !== 'recover');
    }

    function login(e) {
      e.preventDefault();
      var data = formData(e.target);
      server('iniciarSesion', [data.username, data.password], afterLogin);
    }

    function register(e) {
      e.preventDefault();
      server('registrarEstudiante', [formData(e.target)], afterLogin);
    }

    function recoverPassword(e) {
      e.preventDefault();
      var box = document.getElementById('recover-result');
      box.classList.add('hidden');
      server('recuperarContrasena', [formData(e.target)], function(res) {
        box.innerHTML = 'Contrasena temporal: <strong>' + esc(res.temporaryPassword || '') + '</strong><br>Usala para ingresar y luego actualizala desde tu perfil.';
        box.classList.remove('hidden');
        toast('Contrasena temporal generada', 'ok');
      });
    }

    function afterLogin(res) {
      State.token = res.token;
      State.user = res.user;
      localStorage.setItem('facen_token', State.token);
      loadApp();
    }

    function loadApp() {
      showAppShell();
      document.getElementById('content').innerHTML = '<div class="empty">Cargando tus datos...</div>';
      clearTimeout(window.bootstrapTimer);
      window.bootstrapTimer = setTimeout(function() {
        document.getElementById('content').innerHTML = '<div class="empty">La carga esta tardando demasiado. <button class="btn btn-outline btn-small" onclick="loadApp()">Reintentar</button> <button class="btn btn-danger btn-small" onclick="logout()">Cerrar sesion</button></div>';
      }, 18000);
      server('obtenerBootstrap', [State.token], function(res) {
        clearTimeout(window.bootstrapTimer);
        res = normalizeBootstrap(res);
        State.data = res;
        State.user = res.user;
        document.getElementById('user-name').textContent = State.user.nombre || State.user.username || 'Estudiante';
        document.getElementById('top-user').textContent = State.user.nombre || State.user.username || 'Estudiante';
        if (res.warning) toast(res.warning, 'error');
        ensureViewData(State.view);
        render();
        scheduleLocalAlerts();
        setTimeout(preloadDashboardData, 80);
      }, function() {
        clearTimeout(window.bootstrapTimer);
        document.getElementById('content').innerHTML = '<div class="empty">No se pudieron cargar tus datos. Reintenta en unos segundos o vuelve a iniciar sesion.</div>';
      });
    }

    function reloadCatalogo() {
      if (!State.data) return;
      State.data.catalogoLoaded = false;
      State.data.catalogo = [];
      State.data.loading_catalogo = false;
      loadVista('catalogo', 'catalogo', 'catalogoLoaded');
      render();
    }

    function refreshCatalogFromSheet() {
      if (!State.token || !State.data) return;
      if (!confirm('Actualizar asignaturas y horarios desde la hoja de calculo?')) return;
      toast('Actualizando asignaturas y horarios...', 'ok');
      server('actualizarCatalogoDesdeHoja', [State.token], function(res) {
        if (res.catalogo) State.data.catalogo = res.catalogo;
        if (res.carreras) State.data.carreras = res.carreras;
        if (res.inscripciones) State.data.inscripciones = res.inscripciones;
        if (res.notas) State.data.notas = res.notas;
        if (res.agenda) State.data.agenda = res.agenda;
        if (res.resumen) State.data.resumen = res.resumen;
        if (res.catalogoLoaded !== undefined) State.data.catalogoLoaded = res.catalogoLoaded;
        var d = res.diagnostico || {};
        var msg = d.asignaturas ? ('Catalogo actualizado: ' + d.asignaturas + ' asignaturas, ' + d.horarios + ' horarios') : 'Catalogo actualizado';
        toast(msg, 'ok');
        render();
      });
    }

    function normalizeBootstrap(res) {
      res = res || {};
      var perfil = res.perfil || {};
      var name = [perfil.nombres, perfil.apellidos].filter(Boolean).join(' ');
      res.user = res.user || State.user || {};
      res.user.nombre = res.user.nombre || name || res.user.username || 'Estudiante';
      res.user.username = res.user.username || '';
      res.perfil = perfil;
      res.carreras = res.carreras || [];
      res.catalogo = res.catalogo || [];
      res.inscripciones = res.inscripciones || [];
      res.notas = res.notas || [];
      res.apuntes = res.apuntes || [];
      res.eventos = res.eventos || [];
      res.lecturas = res.lecturas || [];
      res.grupos = res.grupos || [];
      res.agenda = res.agenda || [];
      res.malla = res.malla || { items: [], resumen: {} };
      res.mallaLoaded = res.mallaLoaded !== false;
      res.apuntesLoaded = res.apuntesLoaded !== false;
      res.eventosLoaded = res.eventosLoaded !== false;
      res.lecturasLoaded = res.lecturasLoaded !== false;
      res.gruposLoaded = res.gruposLoaded !== false;
      res.companeros = res.companeros || [];
      res.preferencias = res.preferencias || {};
      res.resumen = res.resumen || {};
      return res;
    }

    function showAuth() {
      document.getElementById('auth').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
      loadAuthCarreras();
    }

    function showAppShell() {
      document.getElementById('auth').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }

    function loadAuthCarreras() {
      if (State.authCarrerasLoaded) return;
      State.authCarrerasLoaded = true;
      server('obtenerCarreras', [], function(res) {
        var sel = document.getElementById('register-carrera');
        if (!sel) return;
        sel.innerHTML = careerOptionsFromList(normalizeCarreras(res.carreras), '');
      }, function() {
        var sel = document.getElementById('register-carrera');
        if (sel) sel.innerHTML = careerOptionsFromList(normalizeCarreras([]), '');
        State.authCarrerasLoaded = false;
      });
    }

    function buildNav() {
      var html = State.nav.map(function(n) {
        return '<button data-view="' + n[0] + '" onclick="go(\'' + n[0] + '\')">' + n[1] + '</button>';
      }).join('');
      document.getElementById('nav').innerHTML = html;
      document.getElementById('mobile-nav').innerHTML = html;
    }

    function go(view) {
      State.view = view;
      document.getElementById('sidebar').classList.remove('open');
      ensureViewData(view);
      render();
    }

    function ensureViewData(view) {
      if (!State.data) return;
      if (view === 'materias' && !State.data.catalogoLoaded) return loadVista('catalogo', 'catalogo', 'catalogoLoaded');
      if (view === 'apuntes' && !State.data.apuntesLoaded) return loadVista('apuntes', 'apuntes', 'apuntesLoaded');
      if (view === 'recordatorios' && !State.data.eventosLoaded) return loadVista('eventos', 'eventos', 'eventosLoaded');
      if (view === 'lecturas' && !State.data.lecturasLoaded) return loadVista('lecturas', 'lecturas', 'lecturasLoaded');
      if (view === 'grupos' && !State.data.gruposLoaded) return loadVista('grupos', 'grupos', 'gruposLoaded');
      if (view === 'avance' && !State.data.mallaLoaded) return loadVista('malla', 'malla', 'mallaLoaded');
      if (view === 'perfil' && !(State.data.carreras || []).length) return loadCarreras();
    }

    function preloadDashboardData() {
      if (!State.data || State.view !== 'dashboard') return;
      if (State.data.loading_dashboard_secundario) return;
      if (State.data.eventosLoaded && State.data.lecturasLoaded && State.data.gruposLoaded) return;
      State.data.loading_dashboard_secundario = true;
      server('obtenerDatosVista', [State.token, 'dashboard_secundario'], function(res) {
        State.data.eventos = res.eventos || [];
        State.data.lecturas = res.lecturas || [];
        State.data.grupos = res.grupos || [];
        State.data.eventosLoaded = true;
        State.data.lecturasLoaded = true;
        State.data.gruposLoaded = true;
        State.data.loading_dashboard_secundario = false;
        if (State.view === 'dashboard') render();
      }, function() {
        State.data.loading_dashboard_secundario = false;
        if (State.view === 'dashboard') render();
      });
    }

    function loadCarreras() {
      if (!State.data || State.data.loading_carreras) return;
      State.data.loading_carreras = true;
      server('obtenerCarreras', [], function(res) {
        State.data.carreras = normalizeCarreras(res.carreras);
        State.data.loading_carreras = false;
        if (State.view === 'perfil') render();
      }, function() {
        State.data.carreras = normalizeCarreras([]);
        State.data.loading_carreras = false;
        if (State.view === 'perfil') render();
      });
    }

    function loadVista(vista, key, loadedKey) {
      var loadingKey = 'loading_' + key;
      if (State.data[loadingKey]) return;
      State.data[loadingKey] = true;
      server('obtenerDatosVista', [State.token, vista], function(res) {
        State.data[key] = res[key] || [];
        if (res.carreras) State.data.carreras = res.carreras;
        State.data[loadedKey] = true;
        State.data[loadingKey] = false;
        if (State.view === vista || State.view === 'dashboard' || (vista === 'catalogo' && State.view === 'materias') || (vista === 'eventos' && State.view === 'recordatorios') || (vista === 'malla' && State.view === 'avance')) render();
      }, function() {
        State.data[loadedKey] = false;
        State.data[loadingKey] = false;
        if (State.view === vista || State.view === 'dashboard' || (vista === 'catalogo' && State.view === 'materias') || (vista === 'eventos' && State.view === 'recordatorios') || (vista === 'malla' && State.view === 'avance')) render();
      });
    }

    function render() {
      if (!State.data) return;
      document.querySelectorAll('[data-view]').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-view') === State.view);
      });
      var titles = { dashboard: 'Inicio', materias: 'Materias', avance: 'Avance', horario: 'Horario', agenda: 'Agenda', notas: 'Notas', apuntes: 'Apuntes', lecturas: 'Lecturas', companeros: 'Companeros', grupos: 'Grupos', recordatorios: 'Recordatorios', perfil: 'Perfil' };
      document.getElementById('view-title').textContent = titles[State.view] || 'FACEN App';
      var views = {
        dashboard: renderDashboard,
        materias: renderMaterias,
        avance: renderAvance,
        horario: renderHorario,
        agenda: renderAgenda,
        notas: renderNotas,
        apuntes: renderApuntes,
        lecturas: renderLecturas,
        companeros: renderCompaneros,
        grupos: renderGrupos,
        recordatorios: renderRecordatorios,
        perfil: renderPerfil
      };
      document.getElementById('content').innerHTML = views[State.view]();
    }

    function renderDashboard() {
      var r = State.data.resumen || {};
      var avance = State.data.mallaLoaded ? (((State.data.malla || {}).resumen || {}).avance || 0) + '%' : 'Abrir';
      var lecturasPendientes = State.data.lecturasLoaded ?
        (State.data.lecturas || []).filter(function(l) { return String(l.estado || '').toLowerCase() !== 'completada'; }).length :
        (r.lecturasPendientes || 0);
      var clases = (r.clasesHoy || []).map(function(c) {
        return item(c.asignatura + ' - Seccion ' + c.seccion, c.horario.hora_ini + ' a ' + c.horario.hora_fin + ' - ' + c.horario.aula, '');
      }).join('') || '<div class="empty">No tenes clases cargadas para hoy.</div>';
      var eventos = !State.data.eventosLoaded ? '<div class="empty">Cargando recordatorios...</div>' : upcomingEvents().slice(0, 4).map(function(e) {
        return item(e.titulo, [e.fecha_iso, e.hora, e.nombre_asignatura].filter(Boolean).join(' - '), badge(e.tipo || 'recordatorio'));
      }).join('') || '<div class="empty">Sin recordatorios proximos.</div>';
      var lecturas = !State.data.lecturasLoaded ? '<div class="empty">Cargando lecturas...</div>' : (State.data.lecturas || []).filter(function(l) { return String(l.estado || '').toLowerCase() !== 'completada'; }).slice(0, 4).map(function(l) {
        return compact(l.titulo, [l.nombre_asignatura, l.fecha_objetivo_iso, l.prioridad].filter(Boolean).join(' - '), priorityBadge(l.prioridad));
      }).join('') || '<div class="empty">Sin lecturas pendientes.</div>';
      var grupos = !State.data.gruposLoaded ? '<div class="empty">Cargando grupos...</div>' : (State.data.grupos || []).slice(0, 4).map(function(g) {
        return compact(g.nombre, [g.nombre_asignatura, g.proxima_fecha_iso, g.proxima_hora].filter(Boolean).join(' - '), badge(g.estado || 'Activo'));
      }).join('') || '<div class="empty">Todavia no cargaste grupos.</div>';
      var agenda = (State.data.agenda || []).slice(0, 4).map(function(a) {
        return compact(a.titulo, [a.tipo, a.dia || a.fecha_iso, a.hora_ini, a.sala].filter(Boolean).join(' - '), badge(a.alerta_activa ? 'Alerta' : 'Sin alerta'));
      }).join('') || '<div class="empty">Agrega clases, examenes o reuniones a tu agenda.</div>';
      return head('Inicio', 'Resumen rapido de tu semestre.') +
        '<div class="grid grid-5">' +
          metric('Asignaturas', r.totalAsignaturas || 0) +
          metric('Avance', avance) +
          metric('Promedio', fmt(r.promedio || 0)) +
          metric('Lecturas', lecturasPendientes) +
          metric('Agenda', r.agendaActiva || 0) +
        '</div>' +
        '<div class="planner" style="margin-top:14px;">' +
          '<section class="card card-pad"><h3>Clases de hoy</h3><div class="list">' + clases + '</div></section>' +
          '<section class="card card-pad"><h3>Proximos recordatorios</h3><div class="list">' + eventos + '</div></section>' +
          '<section class="card card-pad"><h3>Agenda editable</h3><div class="compact-list">' + agenda + '</div></section>' +
          '<section class="card card-pad"><h3>Lecturas prioritarias</h3><div class="compact-list">' + lecturas + '</div></section>' +
          '<section class="card card-pad"><h3>Grupos de estudio</h3><div class="compact-list">' + grupos + '</div></section>' +
        '</div>';
    }

    function renderMaterias() {
      State.data.catalogo = State.data.catalogo || [];
      var elegidas = {};
      (State.data.inscripciones || []).forEach(function(i) { elegidas[String(i.id_asignatura)] = true; });
      var perfil = State.data.perfil || {};
      var actuales = (State.data.inscripciones || []).map(function(i) {
        var horarios = (i.horarios || []).map(function(h) { return h.dia + ' ' + h.hora_ini + '-' + h.hora_fin + ' - ' + h.aula; }).join('\n');
        return item(i.nombre_asignatura + ' - ' + i.codigo_seccion, horarios || 'Sin horario', '<button class="btn btn-danger btn-small" onclick="quitarMateria(' + i.id_inscripcion + ')">Quitar</button>');
      }).join('') || '<div class="empty">Todavia no seleccionaste asignaturas.</div>';
      if (!perfil.carrera) {
        return head('Materias', 'Selecciona las asignaturas y secciones que estas cursando.', '<button class="btn btn-outline" onclick="go(\'perfil\')">Elegir carrera</button>') +
          '<section class="card card-pad"><h3>Mis asignaturas</h3><div class="list">' + actuales + '</div></section>' +
          '<div style="height:18px"></div><div class="empty">Primero selecciona tu carrera en Perfil para cargar la lista correcta de asignaturas.</div>';
      }
      var catalogo = !State.data.catalogoLoaded ? '<div class="empty">Cargando catalogo de tu carrera...</div>' : State.data.catalogo.map(function(a) {
        var secs = (a.secciones || []).map(function(s) {
          var hs = (s.horarios || []).map(function(h) { return h.dia + ' ' + h.hora_ini + '-' + h.hora_fin + ' - ' + h.aula; }).join(', ');
          var disabled = elegidas[String(a.id_asignatura)] ? ' disabled' : '';
          var text = elegidas[String(a.id_asignatura)] ? 'Ya seleccionada' : 'Elegir seccion ' + esc(s.codigo_seccion);
          return '<button class="btn btn-outline btn-small" onclick="inscribir(event,\'' + escAttr(s.id_seccion) + '\')"' + disabled + '>' + text + '</button><div class="sub">' + esc(hs || 'Sin horario') + '</div>';
        }).join('<div style="height:8px"></div>');
        var meta = [a.carrera, a.semestre ? 'Semestre ' + a.semestre : '', a.creditos ? a.creditos + ' creditos' : ''].filter(Boolean).join(' - ');
        return '<article class="card card-pad subject" data-search="' + esc((a.codigo + ' ' + a.nombre_asignatura + ' ' + a.carrera).toLowerCase()) + '">' +
          '<div class="title">' + esc(a.codigo) + ' - ' + esc(a.nombre_asignatura) + '</div>' +
          '<div class="sub">' + esc(meta) + '</div>' +
          '<div style="margin-top:12px;">' + secs + '</div></article>';
      }).join('');
      var catalogoBody = catalogo || '<div class="empty">No hay asignaturas disponibles todavia. <button class="btn btn-outline btn-small" onclick="reloadCatalogo()">Recargar catalogo</button></div>';
      return head('Materias', 'Selecciona las asignaturas y secciones que estas cursando.', '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;"><button class="btn btn-primary" onclick="refreshCatalogFromSheet()">Actualizar registros</button><button class="btn btn-outline" onclick="loadApp()">Recargar</button></div>') +
        '<section class="card card-pad"><h3>Mis asignaturas</h3><div class="list">' + actuales + '</div></section>' +
        renderMateriaPicker(elegidas) +
        '<div class="toolbar" style="margin-top:18px;"><input class="input" placeholder="Buscar asignatura, codigo o carrera" oninput="filterSubjects(this.value)"></div>' +
        '<div class="grid grid-3" id="subject-grid">' + catalogoBody + '</div>';
    }

    function renderMateriaPicker(elegidas) {
      if (!State.data.catalogoLoaded) return '<div style="height:18px"></div><section class="card card-pad"><div class="empty">Cargando selector de asignaturas...</div></section>';
      var disponibles = (State.data.catalogo || []).filter(function(a) {
        return !elegidas[String(a.id_asignatura)] && (a.secciones || []).length;
      });
      if (!disponibles.length) return '<div style="height:18px"></div><section class="card card-pad"><div class="empty">No quedan asignaturas disponibles para agregar en tu carrera.</div></section>';
      var first = disponibles[0];
      return '<div style="height:18px"></div><section class="card card-pad">' +
        '<h3>Agregar asignatura</h3>' +
        '<div class="grid grid-3">' +
          '<div class="field"><label>Asignatura</label><select class="select" id="materia-select" onchange="refreshSectionSelect()">' + subjectCatalogOptions(disponibles, '') + '</select></div>' +
          '<div class="field"><label>Seccion y horario</label><select class="select" id="section-select">' + sectionOptions(first) + '</select></div>' +
          '<div class="field"><label>&nbsp;</label><button class="btn btn-primary" onclick="inscribirSeleccionada(event)">Agregar</button></div>' +
        '</div></section>';
    }

    function subjectCatalogOptions(list, selected) {
      return list.map(function(a) {
        var label = (a.codigo ? a.codigo + ' - ' : '') + a.nombre_asignatura;
        return '<option value="' + escAttr(a.id_asignatura) + '"' + (String(selected) === String(a.id_asignatura) ? ' selected' : '') + '>' + esc(label) + '</option>';
      }).join('');
    }

    function sectionOptions(asignatura) {
      asignatura = asignatura || {};
      return (asignatura.secciones || []).map(function(s) {
        return '<option value="' + escAttr(s.id_seccion) + '">' + esc(sectionLabel(s)) + '</option>';
      }).join('');
    }

    function sectionLabel(s) {
      var horarios = (s.horarios || []).map(function(h) {
        return h.dia + ' ' + h.hora_ini + '-' + h.hora_fin + (h.aula ? ' ' + h.aula : '');
      }).join(', ');
      return 'Seccion ' + (s.codigo_seccion || s.id_seccion) + ' - ' + (horarios || 'Sin horario');
    }

    function renderHorario() {
      var rows = [];
      (State.data.inscripciones || []).forEach(function(i) {
        (i.horarios || []).forEach(function(h) { rows.push({ materia: i.nombre_asignatura, seccion: i.codigo_seccion, h: h }); });
      });
      (State.data.agenda || []).filter(function(a) { return String(a.tipo || '').toLowerCase() === 'clase'; }).forEach(function(a) {
        rows.push({ materia: a.titulo, seccion: 'personal', h: { dia: a.dia || a.fecha_iso, hora_ini: a.hora_ini, hora_fin: a.hora_fin, aula: a.sala || 'Sin sala', edificio: a.edificio || '', mapa_url: a.mapa_url } });
      });
      rows.sort(function(a, b) { return dayOrder(a.h.dia) - dayOrder(b.h.dia) || String(a.h.hora_ini).localeCompare(String(b.h.hora_ini)); });
      var body = rows.map(function(r) {
        var map = r.h.mapa_url ? '<div class="sub"><a href="' + escAttr(r.h.mapa_url) + '" target="_blank">Ver mapa</a></div>' : '';
        return '<tr><td>' + esc(r.h.dia) + '</td><td>' + esc(r.h.hora_ini) + ' - ' + esc(r.h.hora_fin) + '</td><td><strong>' + esc(r.materia) + '</strong><div class="sub">Seccion ' + esc(r.seccion) + '</div></td><td>' + esc(r.h.aula) + '<div class="sub">' + esc(r.h.edificio || '') + '</div>' + map + '</td></tr>';
      }).join('');
      return head('Horario', 'Vista ordenada de clases y aulas asignadas.', '<button class="btn btn-primary" onclick="openAgenda(null, \'clase\')">Agregar clase</button>') +
        '<div class="card card-pad schedule">' + (body ? '<table><thead><tr><th>Dia</th><th>Hora</th><th>Asignatura</th><th>Aula</th></tr></thead><tbody>' + body + '</tbody></table>' : '<div class="empty">Agrega materias para ver tu horario.</div>') + '</div>';
    }

    function renderAgenda() {
      var date = parseDateKey(State.calendarDate);
      var body = renderCalendarBody(date);
      var notify = notificationStatusHtml();
      var actions = '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">' +
        '<button class="btn btn-primary" onclick="openAgenda()">Nueva entrada</button>' +
        '<button class="btn btn-outline" onclick="activateNotifications()">Activar avisos</button>' +
        '</div>';
      return head('Agenda', 'Calendario academico editable con clases, examenes, entregas, reuniones y alertas anticipadas.', actions) +
        '<section class="card card-pad calendar-card">' +
          '<div class="notify-strip"><div>' + notify + '<div class="sub">Las notificaciones locales funcionan mientras la app este instalada o abierta con permiso del navegador.</div></div><button class="btn btn-outline btn-small" onclick="activateNotifications()">Permitir avisos</button></div>' +
          '<div class="calendar-top">' +
            '<div class="calendar-title"><strong>' + esc(calendarTitle(date)) + '</strong><span class="sub">' + esc(calendarSubtitle(date)) + '</span></div>' +
            '<div class="calendar-actions">' +
              renderCalendarViewSwitch() +
              '<button class="btn btn-outline btn-small" onclick="moveCalendar(-1)">Anterior</button>' +
              '<button class="btn btn-outline btn-small" onclick="calendarToday()">Hoy</button>' +
              '<button class="btn btn-outline btn-small" onclick="moveCalendar(1)">Siguiente</button>' +
            '</div>' +
          '</div>' +
          body +
        '</section>' +
        '<div style="height:14px"></div><section class="card card-pad"><h3>Alertas</h3>' + renderPrefsForm() + '</section>';
    }

    function renderAvance() {
      if (!State.data.mallaLoaded) return head('Avance', 'Malla, correlatividades y progreso academico.') + '<div class="empty">Cargando malla academica...</div>';
      var m = State.data.malla || { items: [], resumen: {} };
      var r = m.resumen || {};
      if (m.warning || !(m.items || []).length) {
        return head('Avance', 'Malla, correlatividades y progreso academico.', '<button class="btn btn-outline" onclick="loadVista(\'malla\', \'malla\', \'mallaLoaded\')">Reintentar</button>') +
          '<div class="empty">' + esc(m.warning || 'No hay malla academica cargada para tu carrera.') + '</div>';
      }
      var grupos = {};
      (m.items || []).forEach(function(x) {
        var nivel = x.nivel_sugerido ? ('Nivel ' + x.nivel_sugerido) : 'Nivel por confirmar';
        if (!grupos[nivel]) grupos[nivel] = [];
        grupos[nivel].push(x);
      });
      var niveles = Object.keys(grupos).sort(function(a, b) {
        return numberFromText(a, 99) - numberFromText(b, 99) || a.localeCompare(b);
      });
      var timeline = niveles.map(function(nivel) {
        return '<section class="malla-level"><h3>' + esc(nivel) + '</h3>' + grupos[nivel].map(renderMallaSubject).join('') + '</section>';
      }).join('');
      var bloqueadas = (m.items || []).filter(function(x) { return x.estado === 'bloqueada'; }).slice(0, 8).map(function(x) {
        return compact(x.nombre_asignatura, (x.requisitos || []).map(function(rq) { return rq.nombre || rq.codigo; }).join(' - ') || 'Sin requisito registrado', estadoBadge(x.estado));
      }).join('') || '<div class="empty">No hay bloqueos detectados con las notas actuales.</div>';
      return head('Avance', 'Malla completa 2025, correlatividades y avance segun tus materias/notas.', '<button class="btn btn-outline" onclick="loadVista(\'malla\', \'malla\', \'mallaLoaded\')">Actualizar</button>') +
        '<div class="progress-shell">' +
          '<section class="progress-band">' +
            '<div class="card card-pad"><div class="status-row"><span class="badge badge-ok">Plan ' + esc(m.plan || '2025') + '</span><span class="badge">' + esc(m.fuente || 'Guia academica') + '</span></div><h3>' + esc(m.carrera || 'Carrera') + '</h3><div class="progress-bar"><span style="width:' + Math.max(0, Math.min(100, r.avance || 0)) + '%"></span></div><div class="sub">' + esc((r.avance || 0) + '% aprobado: ' + (r.aprobadas || 0) + ' de ' + (r.total || 0) + ' asignaturas.') + '</div></div>' +
            '<div class="grid grid-2">' +
              metric('Aprobadas', r.aprobadas || 0) +
              metric('Cursando', r.cursando || 0) +
              metric('Pendientes', r.pendientes || 0) +
              metric('Bloqueadas', r.bloqueadas || 0) +
            '</div>' +
          '</section>' +
          '<section class="malla-layout">' +
            '<div class="card card-pad"><div class="malla-timeline">' + timeline + '</div></div>' +
            '<aside class="card card-pad"><h3>Correlatividades pendientes</h3><div class="compact-list">' + bloqueadas + '</div></aside>' +
          '</section>' +
        '</div>';
    }

    function renderCalendarBody(date) {
      if (State.calendarView === 'day') return renderCalendarDay(date);
      if (State.calendarView === 'week') return renderCalendarWeek(date);
      if (State.calendarView === 'year') return renderCalendarYear(date);
      if (State.calendarView === 'list') return renderCalendarList(date);
      return renderCalendarMonth(date);
    }

    function renderCalendarViewSwitch() {
      var opts = [['day','Dia'], ['week','Semana'], ['month','Mes'], ['year','Ano'], ['list','Lista']];
      return '<div class="segmented">' + opts.map(function(o) {
        return '<button class="' + (State.calendarView === o[0] ? 'active' : '') + '" onclick="setCalendarView(\'' + o[0] + '\')">' + o[1] + '</button>';
      }).join('') + '</div>';
    }

    function setCalendarView(view) {
      State.calendarView = view;
      localStorage.setItem('facen_calendar_view', view);
      render();
    }

    function moveCalendar(delta) {
      var date = parseDateKey(State.calendarDate);
      if (State.calendarView === 'day' || State.calendarView === 'list') date = addDays(date, delta);
      else if (State.calendarView === 'week') date = addDays(date, delta * 7);
      else if (State.calendarView === 'year') date = new Date(date.getFullYear() + delta, date.getMonth(), date.getDate());
      else date = new Date(date.getFullYear(), date.getMonth() + delta, Math.min(date.getDate(), 28));
      State.calendarDate = dateKey(date);
      localStorage.setItem('facen_calendar_date', State.calendarDate);
      render();
    }

    function calendarToday() {
      State.calendarDate = dateKey(new Date());
      localStorage.setItem('facen_calendar_date', State.calendarDate);
      render();
    }

    function calendarTitle(date) {
      if (State.calendarView === 'day') return formatDateLong(date);
      if (State.calendarView === 'week') {
        var start = startOfWeek(date);
        var end = addDays(start, 6);
        return formatDateShort(start) + ' - ' + formatDateShort(end);
      }
      if (State.calendarView === 'year') return String(date.getFullYear());
      if (State.calendarView === 'list') return 'Proximos eventos';
      return monthNames()[date.getMonth()] + ' ' + date.getFullYear();
    }

    function calendarSubtitle(date) {
      var total = State.data.agenda.length || 0;
      return total + ' entradas guardadas - ' + notificationPermissionLabel();
    }

    function renderCalendarMonth(date) {
      var start = startOfWeek(new Date(date.getFullYear(), date.getMonth(), 1));
      var today = dateKey(new Date());
      var days = [];
      for (var i = 0; i < 42; i++) days.push(addDays(start, i));
      return '<div class="calendar-weekdays">' + dayNamesShort().map(function(d) { return '<div>' + d + '</div>'; }).join('') + '</div>' +
        '<div class="month-grid">' + days.map(function(day) {
          var key = dateKey(day);
          var events = agendaEventsForDate(day);
          return '<div class="calendar-day ' + (day.getMonth() !== date.getMonth() ? 'outside ' : '') + (key === today ? 'today' : '') + '" onclick="openAgenda(null, \'clase\', \'' + key + '\')">' +
            '<div class="day-number"><span>' + day.getDate() + '</span><span class="event-dot">' + (events.length ? events.length + ' evt.' : '') + '</span></div>' +
            events.slice(0, 4).map(renderCalendarEvent).join('') +
            (events.length > 4 ? '<span class="sub">+' + (events.length - 4) + ' mas</span>' : '') +
          '</div>';
        }).join('') + '</div>';
    }

    function renderCalendarWeek(date) {
      var start = startOfWeek(date);
      var days = [];
      for (var i = 0; i < 7; i++) days.push(addDays(start, i));
      return '<div class="week-grid">' + days.map(function(day) {
        var key = dateKey(day);
        var events = agendaEventsForDate(day);
        return '<div class="week-col" onclick="openAgenda(null, \'clase\', \'' + key + '\')">' +
          '<div class="day-number"><span>' + esc(dayNamesShort()[dayOrderFromDate(day)] + ' ' + day.getDate()) + '</span><span class="event-dot">' + events.length + '</span></div>' +
          (events.map(renderCalendarEvent).join('') || '<div class="sub">Sin eventos.</div>') +
        '</div>';
      }).join('') + '</div>';
    }

    function renderCalendarDay(date) {
      var events = agendaEventsForDate(date);
      var hours = [];
      for (var h = 6; h <= 22; h++) hours.push((h < 10 ? '0' : '') + h + ':00');
      return '<div class="day-view">' + hours.map(function(hour) {
        var list = events.filter(function(a) { return String(a.hora_ini || '').slice(0, 2) === hour.slice(0, 2); });
        return '<div class="day-slot"><div class="day-time">' + hour + '</div><div>' + (list.map(renderCalendarEvent).join('') || '<span class="sub">Libre</span>') + '</div></div>';
      }).join('') + (events.filter(function(a) { return !a.hora_ini; }).map(renderCalendarEvent).join('') || '') + '</div>';
    }

    function renderCalendarYear(date) {
      var year = date.getFullYear();
      return '<div class="year-grid">' + monthNames().map(function(name, idx) {
        var monthDate = new Date(year, idx, 1);
        var events = agendaEventsForMonth(monthDate);
        return '<button class="year-month" onclick="State.calendarDate=\'' + dateKey(monthDate) + '\'; State.calendarView=\'month\'; localStorage.setItem(\'facen_calendar_date\', State.calendarDate); localStorage.setItem(\'facen_calendar_view\', State.calendarView); render();">' +
          '<strong><span>' + esc(name) + '</span><span class="badge">' + events.length + '</span></strong>' +
          '<span class="sub">' + esc(events.slice(0, 3).map(function(a) { return a.titulo; }).join(' - ') || 'Sin eventos') + '</span>' +
        '</button>';
      }).join('') + '</div>';
    }

    function renderCalendarList(date) {
      var start = new Date(date); start.setHours(0,0,0,0);
      var rows = [];
      for (var i = 0; i < 90; i++) {
        var day = addDays(start, i);
        agendaEventsForDate(day).forEach(function(a) {
          rows.push({ day: day, event: a });
        });
      }
      rows = rows.slice(0, 60);
      return '<div class="list">' + (rows.map(function(row) {
        var a = row.event;
        var action = isDerivedAgenda(a) ? '<span class="badge">Automatico</span>' : '<button class="btn btn-danger btn-small" onclick="deleteAgenda(' + a.id_agenda + ')">Eliminar</button>';
        return '<div class="item agenda-list-row"><div><strong>' + esc(formatDateShort(row.day)) + '</strong><div class="sub">' + esc(dayNamesShort()[dayOrderFromDate(row.day)]) + '</div></div><div>' + renderCalendarEvent(a) + '</div><div>' + action + '</div></div>';
      }).join('') || '<div class="empty">No hay eventos proximos.</div>') + '</div>';
    }

    function renderCalendarEvent(a) {
      var tipo = String(a.tipo || '').toLowerCase();
      var automatic = isDerivedAgenda(a);
      return '<button class="calendar-event ' + escAttr(tipo + (automatic ? ' automatic' : '')) + '" onclick="event.stopPropagation(); openAgenda(' + a.id_agenda + ')">' +
        '<strong>' + esc(a.titulo || 'Sin titulo') + '</strong>' +
        '<span>' + esc([eventTime(a), a.nombre_asignatura, a.sala, automatic ? 'Automatico' : ''].filter(Boolean).join(' - ')) + '</span>' +
      '</button>';
    }

    function agendaEventsForDate(date) {
      var key = dateKey(date);
      var day = dayNames()[dayOrderFromDate(date)];
      return (State.data.agenda || []).filter(function(a) {
        if (a.fecha_iso) return a.fecha_iso === key;
        return a.dia && dayOrder(a.dia) === dayOrder(day);
      }).sort(function(a, b) {
        return String(a.hora_ini || '99:99').localeCompare(String(b.hora_ini || '99:99')) ||
          String(a.titulo || '').localeCompare(String(b.titulo || ''));
      });
    }

    function agendaEventsForMonth(date) {
      var days = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      var rows = [];
      for (var i = 1; i <= days; i++) {
        agendaEventsForDate(new Date(date.getFullYear(), date.getMonth(), i)).forEach(function(a) { rows.push(a); });
      }
      return rows;
    }

    function notificationStatusHtml() {
      var cls = notificationPermissionClass();
      return '<span class="badge ' + cls + '">' + esc(notificationPermissionLabel()) + '</span>';
    }

    function notificationPermissionClass() {
      if (!('Notification' in window)) return 'badge-danger';
      if (Notification.permission === 'granted') return 'badge-ok';
      if (Notification.permission === 'denied') return 'badge-danger';
      return 'badge-warn';
    }

    function notificationPermissionLabel() {
      if (!('Notification' in window)) return 'Notificaciones no soportadas';
      if (Notification.permission === 'granted') return 'Notificaciones activas';
      if (Notification.permission === 'denied') return 'Notificaciones bloqueadas';
      return 'Notificaciones pendientes';
    }

    function activateNotifications() {
      if (!('Notification' in window)) {
        toast('Este navegador no soporta notificaciones.', 'error');
        return;
      }
      if (Notification.permission === 'granted') {
        scheduleLocalAlerts();
        toast('Avisos activados', 'ok');
        render();
        return;
      }
      Notification.requestPermission().then(function(permission) {
        if (permission === 'granted') {
          scheduleLocalAlerts();
          toast('Avisos activados', 'ok');
        } else {
          toast('El navegador no concedio permiso de avisos.', 'error');
        }
        if (State.view === 'agenda') render();
      });
    }

    function renderMallaSubject(x) {
      var reqs = (x.requisitos || []).map(function(r) { return r.nombre || r.codigo; }).filter(Boolean);
      return '<article class="malla-subject ' + escAttr(x.estado) + '">' +
        '<div class="status-row">' + estadoBadge(x.estado) + (x.creditos ? '<span class="badge">' + esc(x.creditos) + ' creditos</span>' : '') + (x.area ? '<span class="badge">' + esc(x.area) + '</span>' : '') + '</div>' +
        '<div><div class="title">' + esc(x.nombre_asignatura) + '</div><div class="sub">' + esc([x.codigo, x.plan ? 'Plan ' + x.plan : ''].filter(Boolean).join(' - ')) + '</div></div>' +
        '<div class="req-list">' + esc(reqs.length ? ('Requisitos: ' + reqs.join(' - ')) : 'Sin prerrequisitos registrados.') + '</div>' +
      '</article>';
    }

    function estadoBadge(estado) {
      var e = String(estado || 'pendiente').toLowerCase();
      if (e === 'aprobada') return '<span class="badge badge-ok">Aprobada</span>';
      if (e === 'cursando') return '<span class="badge">Cursando</span>';
      if (e === 'bloqueada') return '<span class="badge badge-danger">Bloqueada</span>';
      return '<span class="badge badge-warn">Pendiente</span>';
    }

    function eventTime(a) {
      return [a.hora_ini, a.hora_fin].filter(Boolean).join('-');
    }

    function parseDateKey(value) {
      var m = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return new Date();
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    }

    function dateKey(date) {
      return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
    }

    function addDays(date, days) {
      var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() + days);
      return d;
    }

    function startOfWeek(date) {
      return addDays(date, -dayOrderFromDate(date));
    }

    function dayOrderFromDate(date) {
      return (date.getDay() + 6) % 7;
    }

    function formatDateShort(date) {
      return pad2(date.getDate()) + '/' + pad2(date.getMonth() + 1) + '/' + date.getFullYear();
    }

    function formatDateLong(date) {
      return dayNames()[dayOrderFromDate(date)] + ' ' + formatDateShort(date);
    }

    function dayNames() { return ['Lunes','Martes','Miercoles','Jueves','Viernes','Sabado','Domingo']; }
    function dayNamesShort() { return ['Lun','Mar','Mie','Jue','Vie','Sab','Dom']; }
    function monthNames() { return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function numberFromText(text, fallback) {
      var match = String(text || '').match(/\d+/);
      return match ? Number(match[0]) : fallback;
    }

    function renderNotas() {
      var rows = State.data.notas.map(function(n) {
        return '<div class="item note-row">' +
          '<div><div class="title">' + esc(n.nombre_asignatura) + '</div><div class="sub">Seccion ' + esc(n.codigo_seccion) + '</div></div>' +
          '<div>' + fmt(n.parcial1) + '</div><div>' + fmt(n.parcial2) + '</div><div>' + fmt(n.trabajos) + '</div><div>' + fmt(n.final) + '</div>' +
          '<div><strong>' + fmt(n.promedio) + '</strong><div class="sub">' + esc(n.estado || 'En curso') + '</div></div>' +
          '<button class="btn btn-outline btn-small" onclick="openNota(' + n.id_inscripcion + ')">Editar</button></div>';
      }).join('') || '<div class="empty">Agrega materias para registrar notas.</div>';
      return head('Notas', 'Registra tus parciales, trabajos, finales y observaciones.') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function renderApuntes() {
      if (!State.data.apuntesLoaded) return head('Apuntes', 'Guarda informacion util, enlaces, tareas y recordatorios de estudio.') + '<div class="empty">Cargando apuntes...</div>';
      var rows = State.data.apuntes.map(function(a) {
        return item(a.titulo, [a.tipo, a.nombre_asignatura, a.fecha_modificacion].filter(Boolean).join(' - '), '<button class="btn btn-outline btn-small" onclick="openApunte(' + a.id_apunte + ')">Editar</button><button class="btn btn-danger btn-small" onclick="deleteApunte(' + a.id_apunte + ')">Eliminar</button>');
      }).join('') || '<div class="empty">Crea tu primer apunte.</div>';
      return head('Apuntes', 'Guarda informacion util, enlaces, tareas y recordatorios de estudio.', '<button class="btn btn-primary" onclick="openApunte()">Nuevo apunte</button>') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function renderLecturas() {
      if (!State.data.lecturasLoaded) return head('Lecturas', 'Planifica que leer, prioriza y marca el avance por asignatura.') + '<div class="empty">Cargando lecturas...</div>';
      var rows = (State.data.lecturas || []).map(function(l) {
        var sub = [l.estado, l.prioridad, l.nombre_asignatura, l.fecha_objetivo_iso, l.fuente].filter(Boolean).join(' - ');
        var actions = '<button class="btn btn-outline btn-small" onclick="openLectura(' + l.id_lectura + ')">Editar</button><button class="btn btn-danger btn-small" onclick="deleteLectura(' + l.id_lectura + ')">Eliminar</button>';
        return item(l.titulo, sub, priorityBadge(l.prioridad) + actions);
      }).join('') || '<div class="empty">Carga lecturas, guias, capitulos o enlaces para no perder el hilo.</div>';
      return head('Lecturas', 'Planifica que leer, prioriza y marca el avance por asignatura.', '<button class="btn btn-primary" onclick="openLectura()">Nueva lectura</button>') +
        '<div class="card card-pad"><div class="list reading-list">' + rows + '</div></div>';
    }

    function renderGrupos() {
      if (!State.data.gruposLoaded) return head('Grupos', 'Organiza equipos de estudio con fecha, canal, lugar y objetivo de la proxima reunion.') + '<div class="empty">Cargando grupos...</div>';
      var rows = (State.data.grupos || []).map(function(g) {
        var sub = [g.nombre_asignatura, g.integrantes, g.canal, g.lugar, g.proxima_fecha_iso, g.proxima_hora, g.objetivo].filter(Boolean).join(' - ');
        return item(g.nombre, sub, '<button class="btn btn-outline btn-small" onclick="openGrupo(' + g.id_grupo + ')">Editar</button><button class="btn btn-danger btn-small" onclick="deleteGrupo(' + g.id_grupo + ')">Eliminar</button>');
      }).join('') || '<div class="empty">Crea grupos para coordinar repasos, laboratorios, examenes y entregas.</div>';
      return head('Grupos', 'Organiza equipos de estudio con fecha, canal, lugar y objetivo de la proxima reunion.', '<button class="btn btn-primary" onclick="openGrupo()">Nuevo grupo</button>') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function renderCompaneros() {
      if (!State.data.companerosLoaded) {
        setTimeout(loadCompaneros, 0);
        return head('Companeros', 'Encuentra estudiantes de tus asignaturas y arma grupos de estudio con consentimiento de contacto.') +
          '<div class="empty">Cargando companeros de tus asignaturas...</div>';
      }
      var rows = (State.data.companeros || []).map(function(c) {
        var materias = (c.coincidencias || []).map(function(x) { return x.nombre_asignatura + (x.codigo_seccion ? ' - Seccion ' + x.codigo_seccion : ''); }).join(', ');
        var contacto = c.comparte_contacto ? ['Movil: ' + c.telefono, c.email].filter(Boolean).join(' - ') : 'No comparte contacto';
        var actions = '<button class="btn btn-outline btn-small" onclick="openGrupoCon(' + c.id_estudiante + ')">Crear grupo</button>';
        if (c.telefono) actions += '<a class="btn btn-outline btn-small" href="https://wa.me/' + phoneForWhatsApp(c.telefono) + '" target="_blank">WhatsApp</a>';
        return item(c.nombre, [materias, contacto].filter(Boolean).join('\n'), actions);
      }).join('') || '<div class="empty">Cuando selecciones asignaturas, aca veras companeros que cursan contigo. El movil solo aparece si cada estudiante lo autoriza.</div>';
      return head('Companeros', 'Encuentra estudiantes de tus asignaturas y arma grupos de estudio con consentimiento de contacto.') +
        '<div class="card card-pad"><div class="list">' + rows + '</div></div>';
    }

    function loadCompaneros() {
      if (!State.data || State.data.loadingCompaneros || State.data.companerosLoaded) return;

    function normalizeCarreras(list) {
      var source = (list || []).length ? list : DEFAULT_CARRERAS;

      }).filter(function(c) {

    function deleteAgenda(id) {
      var existing = State.data.agenda.find(function(x) { return x.id_agenda == id; });
      if (isDerivedAgenda(existing)) return toast('Este evento se genera automaticamente desde tu matricula.', 'warn');
      if (!confirm('Eliminar esta entrada?')) return;
      server('eliminarAgenda', [State.token, id], function(res) {
        if (res.agenda) State.data.agenda = res.agenda;
        if (res.resumen) State.data.resumen = res.resumen;
        closeModal();
        toast('Entrada eliminada', 'ok');
        scheduleLocalAlerts();
        if (!res.agenda) loadApp();
        else render();
      });
    }

    function savePerfil(e) {
      e.preventDefault();
      var data = formData(e.target);
      data.comparte_contacto = data.comparte_contacto ? 1 : 0;
      server('guardarPerfil', [State.token, data], function(res) {
        State.data.perfil = Object.assign({}, State.data.perfil || {}, res.perfil || {}, data);
        if (res.user) {
          State.user = res.user;
          State.data.user = res.user;
        }
        if (res.catalogo) State.data.catalogo = res.catalogo;
        if (res.carreras) State.data.carreras = res.carreras;
        if (res.catalogoLoaded !== undefined) State.data.catalogoLoaded = res.catalogoLoaded;
        toast('Perfil guardado', 'ok');
        render();
      });
    }

    function savePreferencias(e) {
      e.preventDefault();
      var data = formData(e.target);
      requestNotifications();
      server('guardarPreferencias', [State.token, data], function(res) {
        State.data.preferencias = Object.assign({}, State.data.preferencias || {}, data, res.preferencias || {});
        toast('Alertas guardadas', 'ok');
        scheduleLocalAlerts();
        render();
      });
    }

    function requestNotifications() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function scheduleLocalAlerts() {
      State.alertTimers.forEach(function(id) { clearTimeout(id); });
      State.alertTimers = [];
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      var prefs = State.data.preferencias || {};
      (State.data.agenda || []).forEach(function(a) {
        if (!a.alerta_activa || !alertEnabledFor(a.tipo, prefs)) return;
        var when = nextAgendaDate(a);
        if (!when) return;
        var mins = Number(a.minutos_antes || minutesFor(a.tipo, prefs) || 15);
        var delay = when.getTime() - Date.now() - mins * 60000;
        if (delay < 0 || delay > 24 * 60 * 60 * 1000) return;
        State.alertTimers.push(setTimeout(function() {
          new Notification('FACEN App', {
            body: a.titulo + ' - ' + [a.sala, a.edificio, a.hora_ini].filter(Boolean).join(' - '),
            tag: 'facen-' + a.id_agenda
          });
        }, delay));
      });
    }

    function alertEnabledFor(tipo, prefs) {
      var t = String(tipo || '').toLowerCase();
      if (t === 'clase') return String(prefs.alertas_clases) !== '0';
      if (t === 'examen') return String(prefs.alertas_examenes) !== '0';
      if (t === 'reunion') return String(prefs.alertas_reuniones) !== '0';
      if (t === 'entrega') return String(prefs.alertas_entregas) !== '0';
      return true;
    }

    function minutesFor(tipo, prefs) {
      var t = String(tipo || '').toLowerCase();
      if (t === 'clase') return prefs.minutos_clases;
      if (t === 'examen') return prefs.minutos_examenes;
      if (t === 'reunion') return prefs.minutos_reuniones;
      if (t === 'entrega') return prefs.minutos_entregas;
      return 15;
    }

    function nextAgendaDate(a) {
      var date = a.fecha_iso ? new Date(a.fecha_iso + 'T' + (a.hora_ini || '08:00')) : null;
      if (!date && a.dia) {
        var today = new Date();
        var target = dayOrder(a.dia);
        if (target < 0) return null;
        var current = (today.getDay() + 6) % 7;
        var diff = (target - current + 7) % 7;
        date = new Date(today.getFullYear(), today.getMonth(), today.getDate() + diff);
        var parts = String(a.hora_ini || '08:00').split(':');
        date.setHours(Number(parts[0]) || 8, Number(parts[1]) || 0, 0, 0);
        if (date.getTime() < Date.now()) date.setDate(date.getDate() + 7);
      }
      return date;
    }

    function subjectOptions(selected) {
      var opts = '<option value="">Sin asignatura</option>';
      State.data.inscripciones.forEach(function(i) {
        opts += '<option value="' + i.id_asignatura + '"' + (String(selected) === String(i.id_asignatura) ? ' selected' : '') + '>' + esc(i.nombre_asignatura) + '</option>';
      });
      return opts;
    }
    function options(list, selected) {
      return list.map(function(v) { return '<option value="' + v + '"' + (v === selected ? ' selected' : '') + '>' + v + '</option>'; }).join('');
    }
    function filterSubjects(q) {
      q = String(q || '').toLowerCase();
      document.querySelectorAll('.subject').forEach(function(el) {
        el.style.display = el.getAttribute('data-search').indexOf(q) >= 0 ? '' : 'none';
      });
    }
    function upcomingEvents() {
      var today = new Date(); today.setHours(0,0,0,0);
      return State.data.eventos.filter(function(e) { return new Date(e.fecha_iso || e.fecha) >= today; });
    }
    function dayOrder(day) {
      return ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'].indexOf(norm(day));
    }
    function phoneForWhatsApp(phone) {
      var digits = String(phone || '').replace(/\D/g, '');
      if (digits && digits.indexOf('595') !== 0 && digits.charAt(0) === '0') digits = '595' + digits.slice(1);
      return digits;
    }
    function updateAppVersion() {
      var stamp = Date.now();
      toast('Buscando version nueva...', 'ok');
      if ('caches' in window) caches.keys().then(function(keys) {
        return Promise.all(keys.map(function(key) { return caches.delete(key); }));
      }).catch(function() {});
      if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(regs) {
        return Promise.all(regs.map(function(reg) { return reg.update().then(function() { return reg.unregister(); }).catch(function() { return reg.unregister(); }); }));
      }).catch(function() {});
      try { sessionStorage.setItem('facen_updated_at', String(stamp)); } catch (e) {}
      window.open('https://appfacen.github.io/Facen-APP/?v=' + stamp, '_top');
    }
    function logout() {
      server('cerrarSesion', [State.token], function() {});
      localStorage.removeItem('facen_token');
      State.token = '';
      State.data = null;
      showAuth();
    }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); }
    function openModal(title, body, foot) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal-foot').innerHTML = foot || '';
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
    function closeModalOnBackdrop(e) { if (e.target.id === 'modal') closeModal(); }
    function toast(msg, type) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type || '');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(function() { t.className = 'toast'; }, 2800);
    }
    function formData(form) {
      var obj = {};
      Array.prototype.forEach.call(form.elements, function(el) {
        if (!el.name || el.disabled) return;
        if ((el.type === 'checkbox' || el.type === 'radio') && !el.checked) return;
        obj[el.name] = el.type === 'checkbox' ? !!el.checked : el.value;
      });
      return obj;
    }
    function fmt(v) { return v === '' || v === null || v === undefined || isNaN(v) ? '-' : Number(v).toFixed(2); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function escAttr(s) { return esc(s); }
    function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
  </script>
</body>
</html>
